[preset.0]
name="Windows Launcher"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="bundled/*,build_info.json,translations/*.json,assets/cards/*.zip,assets/cards/*.json,assets/card_backs/*.jpg"
exclude_filter="tests/*,scenarios/*,temp/*,artifacts/*,data/*"
export_path=""
script_export_mode=1

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
application/product_name="Yu-Gi-Oh! 2"
application/icon="res://assets/icons/launcher.ico"
application/file_description="Yu-Gi-Oh! 2"
codesign/enable=false

[preset.1]
name="Android Tablet"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="*.pck,*.json,translations/*.json,*.sha256,assets/cards/*.zip,assets/cards/*.json,assets/card_backs/*.jpg"
exclude_filter="tests/*,temp/*,artifacts/*"
export_path="../artifacts/android/PowerOfChaos2-tablet-v22.apk"
script_export_mode=1

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=49
version/name="0.49-originals-android"
package/unique_name="com.powerofchaos.arabic.edition2"
package/name="Yu-Gi-Oh! 2"
package/signed=true
launcher_icons/main_192x192="res://assets/icons/launcher.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/launcher-adaptive-foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/icons/launcher-adaptive-background.svg"
launcher_icons/adaptive_monochrome_432x432="res://assets/icons/launcher-adaptive-monochrome.svg"
screen/immersive_mode=true
