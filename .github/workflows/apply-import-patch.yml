name: Apply import patch
on:
  push:
    branches:
      - import-save-name
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/imp.patch
          git apply --check /tmp/imp.patch
          git apply /tmp/imp.patch
          git config user.name "Instinct Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A -- Yu-Gi-Oh-Power-of-Chaos-Remake-main
          git commit -m "Import: keep file name, show saved deck count"
          git push origin HEAD:import-save-name
