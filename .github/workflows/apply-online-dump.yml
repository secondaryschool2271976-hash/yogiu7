name: Apply online dump
on:
  push:
    paths:
      - .github/workflows/apply-online-dump.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/scenes/duel/duel_presentation.gd" "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/scenes/duel/joey_native_normal.gd" "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/scenes/duel/joey_presentation_adapter.gd"
          git commit -m "Online: use the attack event's own player for the Joey attack animation; keep a short online event log and copy it to the clipboard at duel end (untested online)"
          git push
