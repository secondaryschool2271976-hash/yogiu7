name: Apply UI patch
on:
  push:
    branches:
      - ui-test-screen-deck-art
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/ui.patch
          git apply --check /tmp/ui.patch
          git apply /tmp/ui.patch
          git config user.name "Instinct Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A -- Yu-Gi-Oh-Power-of-Chaos-Remake-main
          git commit -m "Card test screen: per-side hand/field/spell-trap/graveyard, deck picker; deck art load fix; newest-first deck list"
          git push origin HEAD:ui-test-screen-deck-art
