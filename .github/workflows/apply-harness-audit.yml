name: Apply duel harness audit rule
on:
  push:
    paths:
      - .github/workflows/apply-harness-audit.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --index /tmp/fix.patch
          git config user.name "Instinct Agent"
          git config user.email "agent@instinct.com"
          git commit -m "Public audit: allow the duel harness under game/tests/duel_harness"
          git push
