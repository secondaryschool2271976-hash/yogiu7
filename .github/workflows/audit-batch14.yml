name: Audit batch 8
on:
  push:
    paths:
      - .github/workflows/audit-batch14.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite branch with the patch only
        env:
          PATCH_B64: ""
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          rm -f .github/workflows/audit-batch14.yml
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git add -A
          git commit -m "Custom cards audit batch 14: Demotion and Rod of the Mind Eye"
          git push -f origin "HEAD:refs/heads/$BR"
          echo done
