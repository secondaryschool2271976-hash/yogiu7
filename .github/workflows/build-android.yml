            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($b64))
          }
          if (-not (Test-Path $key)) {
            Write-Error "Missing fixed signing keystore: $key"
            exit 1
          }
          & $keytool -list -v -keystore $key -storepass android -alias androiddebugkey
          if ($LASTEXITCODE) {
            Write-Error "Signing keystore failed validation: $key"
            exit $LASTEXITCODE
          }
          $signing = @("--keystore", $key, "--custom-key")
          python tools/build_android.py --engine-cache "${{ runner.tool_cache }}/poc-godot-4.7.2" --out "$env:RUNNER_TEMP/android" @signing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $meta = Get-Content "$env:RUNNER_TEMP/android/ANDROID_RELEASE.json" -Raw | ConvertFrom-Json
          Write-Host "Verified APK package=$($meta.package) version_code=$($meta.version_code) sha256=$($meta.signing_certificate_sha256)"
          if ($expectedSha -and $meta.signing_certificate_sha256 -ne $expectedSha) {
            throw "Unexpected APK signing certificate: $($meta.signing_certificate_sha256) != $expectedSha"
          }
      - name: Clean temporary signing keystore
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "signing.keystore")
      - name: Clean old Actions artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ids = gh api --paginate "repos/$($env:GH_REPO)/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>$null
          foreach ($id in $ids) {
            if ($id -and "$id".Trim()) {
              gh api -X DELETE "repos/$($env:GH_REPO)/actions/artifacts/$($id.Trim())" 2>$null | Out-Null
            }
          }
      - name: Publish Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isTag = $env:GITHUB_REF -like 'refs/tags/v*'
          $tag = if ($isTag) { $env:GITHUB_REF_NAME } else { 'latest-build' }
          $files = @(
            (Join-Path $env:RUNNER_TEMP "android/PowerOfChaos-Android.apk"),
            (Join-Path $env:RUNNER_TEMP "android/PowerOfChaos-Android.apk.sha256"),
            (Join-Path $env:RUNNER_TEMP "android/ANDROID_RELEASE.json")
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'android-release-notes.md'
          Set-Content -Path $notesFile -Value "Latest automated Android APK build from commit $($env:GITHUB_SHA) (run #$($env:GITHUB_RUN_NUMBER))." -Encoding UTF8

          $ErrorActionPreference = 'Continue'
          gh release view "$tag" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if (-not $exists) {
            $title = if ($isTag) { $tag } else { 'Latest Build (PC & Android)' }
            $createArgs = @('release', 'create', $tag, '--prerelease', '--title', $title, '--notes-file', $notesFile)
            if ($isTag) {
              $createArgs += '--verify-tag'
            } else {
              $createArgs += @('--target', $env:GITHUB_SHA)
            }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              gh release view "$tag" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
            }
          }

          $relId = (& gh api "repos/$($env:GH_REPO)/releases/tags/$tag" --jq '.id')
          if (-not $relId) { throw "Failed to resolve release id for $tag" }
          $relId = $relId.Trim()
          foreach ($f in $files) {
            $name = Split-Path $f -Leaf
            $tmpName = "$name.next"
            # Remove any stale temp upload left by a previously failed run.
            $existing = & gh api "repos/$($env:GH_REPO)/releases/$relId/assets?per_page=100" | ConvertFrom-Json
            $stale = $existing | Where-Object { $_.name -eq $tmpName } | Select-Object -First 1
            if ($stale) { & gh api -X DELETE "repos/$($env:GH_REPO)/releases/assets/$($stale.id)" *> $null }
            # Upload the replacement under a temporary name first, so the
            # stable download URL never points at a missing file.
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & gh api -X POST "https://uploads.github.com/repos/$($env:GH_REPO)/releases/$relId/assets?name=$tmpName" -H "Content-Type: application/octet-stream" --input "$f" *> $null
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Write-Warning "Upload attempt $attempt for $name failed, retrying in 5s..."
              Start-Sleep -Seconds 5
            }
            if (-not $uploaded) { throw "Failed to upload $name to release $tag" }
            # Swap: delete the old asset only after its replacement exists.
            $assets = & gh api "repos/$($env:GH_REPO)/releases/$relId/assets?per_page=100" | ConvertFrom-Json
            $oldId = ($assets | Where-Object { $_.name -eq $name } | Select-Object -First 1).id
            $newId = ($assets | Where-Object { $_.name -eq $tmpName } | Select-Object -First 1).id
            if (-not $newId) { throw "Uploaded asset $tmpName not found on release $tag" }
            if ($oldId) { & gh api -X DELETE "repos/$($env:GH_REPO)/releases/assets/$oldId" *> $null }
            & gh api -X PATCH "repos/$($env:GH_REPO)/releases/assets/$newId" -f "name=$name" *> $null
            if ($LASTEXITCODE -ne 0) { throw "Failed to rename $tmpName to $name" }
          }
          Write-Host "Published Android APK to GitHub Release: $tag"
      - name: Print Android build diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "android/work/build"
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -Filter "*.log" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content -Path $_.FullName -Tail 120 -ErrorAction SilentlyContinue
            }
          }
