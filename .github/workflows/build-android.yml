name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Yu-Gi-Oh-Power-of-Chaos-Remake-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Yu-Gi-Oh-Power-of-Chaos-Remake-main/tools/pyproject.toml
      - name: Install converter tools
        run: python -m pip install ./tools
      - name: Run Android toolchain tests
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest discover -s tools/tests -p test_android_builder.py -v
          python -m unittest discover -s tools/tests -p test_android_toolchain.py -v
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/poc-godot-4.7.2
          key: godot-windows-4.7.2-verified-v2
      - name: Configure optional Google Drive OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET }}
        run: |
          $path = (Resolve-Path "game/project.godot").Path
          $text = [IO.File]::ReadAllText($path)
          if ($env:GOOGLE_OAUTH_CLIENT_SECRET) {
            if ([regex]::IsMatch($text, '(?m)^client_secret=""')) {
              $text = [regex]::Replace($text, '(?m)^client_secret=""', { 'client_secret="' + $env:GOOGLE_OAUTH_CLIENT_SECRET + '"' })
            }
          }
          if ($env:GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET) {
            if ([regex]::IsMatch($text, '(?m)^desktop_client_secret=""')) {
              $text = [regex]::Replace($text, '(?m)^desktop_client_secret=""', { 'desktop_client_secret="' + $env:GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET + '"' })
            }
          }
          [IO.File]::WriteAllText($path, $text)
      - name: Build Android APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $presetPath = (Resolve-Path "game/export_presets.cfg").Path
          $presetText = [IO.File]::ReadAllText($presetPath).Replace("`r`n", "`n")
          $verCode = [Math]::Max(1000 + [int]$env:GITHUB_RUN_NUMBER, [int]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - 1700000000))
          $presetText = [regex]::Replace($presetText, '(?m)^version/code=\d+$', "version/code=$verCode")
          $presetText = [regex]::Replace($presetText, '(?m)^version/name="[^"]*"$', "version/name=`"0.48.$($env:GITHUB_RUN_NUMBER)-custom-android`"")
          [IO.File]::WriteAllText($presetPath, $presetText, [Text.UTF8Encoding]::new($false))
          Write-Host "Android package version/code=$verCode"
          $java = if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } elseif ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME_17_X64 } else { $env:JAVA_HOME }
          $keytool = Join-Path $java "bin/keytool.exe"
          $key = Join-Path $env:RUNNER_TEMP "signing.keystore"
          $expectedSha = '5e1946afaf90157db432e0733e9ae37f9d0424b112f52d03de66e889b992ee60'
          $secretB64 = if ($env:ANDROID_KEYSTORE_BASE64) { $env:ANDROID_KEYSTORE_BASE64 } else { $env:ANDROID_SIGNING_KEYSTORE }
