name: Apply card fix
on:
  push:
    paths:
      - .github/workflows/apply-card-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/custom_effects_spells.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/duel_port_e.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/extra_card_effects.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/joey/joey_port_zm.gd"
          git commit -m "HERO fusions: generic recipes (Infernal Rage, Voltic Thunder, Neos Knight), Neos Alius as Neos, Miracle Fusion uses recipes; Book of Moon/Taiyou target picker"
          git push
