name: Apply card fix
on:
  push:
    paths:
      - .github/workflows/apply-card-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64_0: ""
        run: |
          set -e
          printf %s "$PATCH_B64_0" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/custom_card_effects.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/custom_effects_traps.gd"
          git commit -m "Joey: offer battle-destroyed traps from the 0x15 send-to-GY event"
          git push
