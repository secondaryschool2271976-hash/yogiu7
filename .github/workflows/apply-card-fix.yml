name: Apply card fix
on:
  push:
    paths:
      - .github/workflows/apply-card-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/core/ydc.gd Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/scenes/deck_editor/deck_import_picker.gd Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/scenes/deck_editor/deck_editor.gd
          git commit -m "Deck import: touch-friendly buttons, no Select all, multi-file, YDK support"
          git push
