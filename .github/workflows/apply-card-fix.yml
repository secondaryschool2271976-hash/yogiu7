name: Apply card fix
on:
  push:
    paths:
      - .github/workflows/apply-card-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: ""
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/custom_card_effects.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/custom_effects_spells.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/core/duel_port_l.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/game/duel/joey/joey_port_y.gd"
          git add "Yu-Gi-Oh-Power-of-Chaos-Remake-main/tools/tests/test_ygojson_and_extra_effects.py"
          git commit -m "Skull Lair: custom override of the native card (engine hook for native ids in NATIVE_OVERRIDES)"
          git push
