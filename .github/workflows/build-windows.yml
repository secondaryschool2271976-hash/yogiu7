        continue-on-error: true
        with:
          name: PowerOfChaos-PC-Update
          path: |
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows-split/PowerOfChaos.pck
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows-split/PowerOfChaos.pck.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: PowerOfChaos-PC-Runner
          path: |
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows-split/PowerOfChaos.exe
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows-split/PowerOfChaos.exe.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: PowerOfChaos-Windows
          path: |
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/PowerOfChaos.exe
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/PowerOfChaos.exe.sha256
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/BUILD_MANIFEST.json
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/PowerOfChaos-Android.apk
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/PowerOfChaos-Android.apk.sha256
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/ANDROID_RELEASE.json
          if-no-files-found: error
          retention-days: 1
      - name: Conservar diagnóstico de compilación
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-logs
          path: |
            Yu-Gi-Oh-Power-of-Chaos-Remake-main/dist/windows/logs/
            ${{ runner.temp }}/android/work/build/*.log
            ${{ runner.temp }}/android/work/build/*.json
          if-no-files-found: ignore
          retention-days: 1
