            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($b64))
          }
          if (-not (Test-Path $key)) {
            Write-Error "Missing fixed signing keystore: $key"
            exit 1
          }
          & $keytool -list -v -keystore $key -storepass android -alias androiddebugkey
          if ($LASTEXITCODE) {
            Write-Error "Signing keystore failed validation: $key"
            exit $LASTEXITCODE
          }
          $signing = @("--keystore", $key, "--custom-key")
          python tools/build_android.py --engine-cache "${{ runner.tool_cache }}/poc-godot-4.7.2" --out "$env:RUNNER_TEMP/android" @signing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $meta = Get-Content "$env:RUNNER_TEMP/android/ANDROID_RELEASE.json" -Raw | ConvertFrom-Json
          Write-Host "Verified APK package=$($meta.package) version_code=$($meta.version_code) sha256=$($meta.signing_certificate_sha256)"
          if ($expectedSha -and $meta.signing_certificate_sha256 -ne $expectedSha) {
            throw "Unexpected APK signing certificate: $($meta.signing_certificate_sha256) != $expectedSha"
          }
      - name: Borrar la clave de firma del runner
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "signing.keystore")
      - name: Compilar launcher y conversor local
        run: python tools/build_windows.py --engine-cache "${{ runner.tool_cache }}/poc-godot-4.7.2" --out dist/windows --split-out dist/windows-split --android "$env:RUNNER_TEMP/android"
      - name: Limpiar artifacts antiguos para liberar cuota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ids = gh api --paginate "repos/$($env:GH_REPO)/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>$null
          foreach ($id in $ids) {
            if ($id -and "$id".Trim()) {
              gh api -X DELETE "repos/$($env:GH_REPO)/actions/artifacts/$($id.Trim())" 2>$null | Out-Null
            }
          }
      - name: Publicar compilación en GitHub Releases (sin límite de cuota de Artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isTag = $env:GITHUB_REF -like 'refs/tags/v*'
          $tag = if ($isTag) { $env:GITHUB_REF_NAME } else { 'latest-build' }
          $stage = Join-Path $env:RUNNER_TEMP 'release-upload'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "dist/windows/PowerOfChaos.exe" (Join-Path $stage "PowerOfChaos.exe")
          Copy-Item "dist/windows/PowerOfChaos.exe.sha256" (Join-Path $stage "PowerOfChaos.exe.sha256")
          Copy-Item "dist/windows/BUILD_MANIFEST.json" (Join-Path $stage "BUILD_MANIFEST.json")
          Copy-Item "dist/windows/PowerOfChaos-Android.apk" (Join-Path $stage "PowerOfChaos-Android.apk")
          Copy-Item "dist/windows/PowerOfChaos-Android.apk.sha256" (Join-Path $stage "PowerOfChaos-Android.apk.sha256")
          Copy-Item "dist/windows/ANDROID_RELEASE.json" (Join-Path $stage "ANDROID_RELEASE.json")
          if (Test-Path "dist/windows-split/PowerOfChaos.pck") {
            Copy-Item "dist/windows-split/PowerOfChaos.pck" (Join-Path $stage "PowerOfChaos.pck")
            Copy-Item "dist/windows-split/PowerOfChaos.pck.sha256" (Join-Path $stage "PowerOfChaos.pck.sha256")
          }
          if (Test-Path "dist/windows-split/PowerOfChaos.exe") {
            Copy-Item "dist/windows-split/PowerOfChaos.exe" (Join-Path $stage "PowerOfChaos-Runner.exe")
            Copy-Item "dist/windows-split/PowerOfChaos.exe.sha256" (Join-Path $stage "PowerOfChaos-Runner.exe.sha256")
          }

          $files = @(Get-ChildItem -Path $stage -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "No release files staged in $stage" }

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          if ($isTag) {
            python tools/pocx/release_notes.py RELEASE_NOTES.md "$tag" "$notesFile"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $notesFile)) {
              Set-Content -Path $notesFile -Value "Release $tag" -Encoding UTF8
            }
          } else {
            Set-Content -Path $notesFile -Value "Latest automated PC & Android build from commit $($env:GITHUB_SHA) (run #$($env:GITHUB_RUN_NUMBER))." -Encoding UTF8
          }

          $ErrorActionPreference = 'Continue'
          gh release view "$tag" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if (-not $exists) {
            $title = if ($isTag) { $tag } else { 'Latest Build (PC & Android)' }
            $createArgs = @('release', 'create', $tag, '--prerelease', '--title', $title, '--notes-file', $notesFile)
            if ($isTag) {
              $createArgs += '--verify-tag'
            } else {
              $createArgs += @('--target', $env:GITHUB_SHA)
            }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              gh release view "$tag" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
            }
          } else {
            gh release edit "$tag" --notes-file "$notesFile" | Out-Null
          }

          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & gh release upload "$tag" @files --clobber
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            Write-Warning "Release upload attempt $attempt failed, retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          if (-not $uploaded) { throw "Failed to upload release assets to $tag" }
          Write-Host "Published $($files.Count) files to GitHub Release: $tag"
