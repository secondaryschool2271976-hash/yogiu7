name: Audit batch 1
on:
  push:
    paths:
      - .github/workflows/audit-batch1.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build branch, PR and merge
        env:
          PATCH_B64: ""
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          echo "trigger branch: $BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          rm -f .github/workflows/audit-batch1.yml
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git add -A
          git commit -m "Custom cards audit batch 1: continuous protections, optional Ra LP cost, zone immunities, Guardian Slime"
          git push -f origin "HEAD:refs/heads/$BR"
          num=$(gh pr list --head "$BR" --state open --json number -q '.[0].number' || true)
          if [ -z "$num" ]; then
            gh pr create --base main --head "$BR" --title "Custom cards audit batch 1: protections, Ra optional LP, Guardian Slime" --body "From the full custom-card audit (batch 1). Continuous protections for Moremarshmallon (2618), Sengenjin Wakes (2633) and Shield of the Millennium Dynasty (2634); Obelisk (2500) and Sphere Mode (2503) cannot be targeted by the opponent; Winged Dragon of Ra (2501) LP payment is optional; Guardian Slime (2588) can summon itself from the hand after taking damage." || true
            num=$(gh pr list --head "$BR" --state open --json number -q '.[0].number' || true)
          fi
          echo "PR=$num"
          if [ -n "$num" ]; then
            for i in 1 2 3 4 5 6; do
              if gh pr merge "$num" --squash --delete-branch; then echo "merged"; break; fi
              echo "merge attempt $i failed, retrying"; sleep 10
            done
          fi
          echo done
